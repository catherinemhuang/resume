<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Resume</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>My Resume</h1>
    <a class="download-btn" href="resume/ RR.pdf" download>Download PDF</a>
  </header>

  <main>
    <!-- Embedded PDF viewer -->
    <object data="resume/ RR.pdf" type="application/pdf" width="100%" height="100%">
      <p>
        Your browser can't display the PDF inline.
        <a href="resume/ RR.pdf">Click here to download it instead.</a>
      </p>
    </object>
  </main>

  <footer>
    <p>Built with a simple static site — just replace <code>resume/resume.pdf</code> to update.</p>
  </footer>
</body>
</html>
